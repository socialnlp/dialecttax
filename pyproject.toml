[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialecttax"
version = "0.1.0"
description = "Measuring how tokenization disadvantages English dialects across language and reward models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
# The scientific stack is pinned to the minor series the published numbers were
# produced with; uv.lock records the exact patch versions. Tooling that cannot
# change results (tqdm, wandb, docker, aiohttp, hydra) floats.
dependencies = [
    "accelerate==1.12.*",
    "aiohttp>=3.13",
    "datasets==4.6.*",
    "docker>=7.1",
    "faiss-cpu==1.12.*",
    "google-cloud-translate>=3.24",
    "huggingface-hub>=1.22",
    "hydra-core>=1.3",
    "matplotlib==3.10.*",
    "numpy==2.4.*",
    "pandas==3.0.*",
    "pyyaml>=6.0",
    "scikit-learn==1.8.*",
    "scipy==1.17.*",
    "seaborn>=0.13",
    "sentence-transformers==5.2.*",
    "statsmodels==0.14.*",
    "tiktoken==0.12.*",
    "torch==2.10.*",
    "torchvision==0.25.*",
    "tqdm>=4.67",
    "transformers==5.3.*",
    "wandb>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
    "jupyterlab>=4.5",
    "ipywidgets>=8.1",
]

# Multi-VALUE (`value-nlp`) is deliberately NOT here. It needs spaCy on Python <= 3.12
# with torch < 2.6 / transformers < 4.50, which cannot coexist with this env. Stage 0
# builds a throwaway venv for it; see scripts/multivalue/generate_multivalue.py.
# flash-attn is also excluded: it needs `--no-build-isolation` against an installed
# torch, so it cannot be resolved from a lockfile. See README "CUDA".

[tool.uv]
# cu129 wheels are x86_64 Linux only; restricting the lock keeps it small and
# deterministic instead of resolving branches that can never install here.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Torch comes from the CUDA 12.9 index rather than plain PyPI. cu129 runs on any
# CUDA 12 or 13 driver, whereas the default PyPI wheel is now a cu13 build that
# needs a CUDA 13 driver and fails at init on 12.4-capped boxes (libcudart.so.13).
# Pinning the index here (rather than passing --torch-backend at install time) is
# what lets uv.lock record the exact +cu129 wheels, so `uv sync` reproduces them.
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
